{{ extends 'global/Page.html' }}

{{ block title }}

{{ block content }}

<div style="max-width: 850px; margin: 0 auto; line-height: 1.5;">
    <p>
        <strong>Utilizando una escala de 1 a 7, donde 1 significa nada interesado(a) y 7 muy interesado(a), ¿Qué tan interesado está Ud. en la política?</strong>
    </p>

    <div style="display:flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 20px 0;">
        <label><input type="radio" name="political_interest" value="1"> 1</label>
        <label><input type="radio" name="political_interest" value="2"> 2</label>
        <label><input type="radio" name="political_interest" value="3"> 3</label>
        <label><input type="radio" name="political_interest" value="4"> 4</label>
        <label><input type="radio" name="political_interest" value="5"> 5</label>
        <label><input type="radio" name="political_interest" value="6"> 6</label>
        <label><input type="radio" name="political_interest" value="7"> 7</label>
    </div>

    {{ next_button }}
</div>

{{ endblock }}
